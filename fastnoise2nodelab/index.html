<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FastNoise Node Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a sticky instrument bar with seven views; each view is summary first (tiles, chips, live canvas), detail below or in a drawer. */
:root {
  --bg: #eceeea; --panel: #f7f8f5; --panel2: #e1e5de; --fg: #1b211e; --mut: #58645d; --line: #cdd3cb; --line2: #b3bcb2;
  --accent: #27647f; --accent-ink: #ffffff; --warn: #a8660a; --bad: #b3372b;
  --ship: #1f7f4c; --mode: #2563b0; --show: #b4650c; --recipe: #7a3fc2; --drop: #7b8480;
  --canvas: #0e1311; --on-canvas: #e4e9e5; --canvas-veil: rgba(10, 14, 12, .78); --shadow: 0 8px 28px rgba(20, 30, 25, .18);
  --sans: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121615; --panel: #1a201e; --panel2: #242c29; --fg: #e4e9e5; --mut: #9aa69f; --line: #2c3531; --line2: #3f4a45;
  --accent: #6fb3d2; --accent-ink: #0f1412; --warn: #d9923a; --bad: #ef7f72;
  --ship: #35a06c; --mode: #4f9ad8; --show: #cf8530; --recipe: #9c7fd8; --drop: #8e9a95; --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121615; --panel: #1a201e; --panel2: #242c29; --fg: #e4e9e5; --mut: #9aa69f; --line: #2c3531; --line2: #3f4a45;
  --accent: #6fb3d2; --accent-ink: #0f1412; --warn: #d9923a; --bad: #ef7f72;
  --ship: #35a06c; --mode: #4f9ad8; --show: #cf8530; --recipe: #9c7fd8; --drop: #8e9a95; --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); margin: 0; padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 20px; font-weight: 700; margin-block: 8px 4px; }
h3 { font-size: 16px; font-weight: 700; }
h4 { font-size: 14px; font-weight: 600; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: .86em; }
code { background: var(--panel2); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
pre { font: 12px/1.45 var(--mono); background: var(--panel2); padding: 10px; border-radius: 4px; overflow-x: auto; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line2); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on, .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .card:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select, input[type=text], input[type=search], input[type=number], textarea { background: var(--panel); border: 1px solid var(--line2); border-radius: 4px; padding: 4px 8px; min-width: 0; max-width: 100%; }
input[type=range] { accent-color: var(--accent); width: 100%; min-width: 0; }
.mut { color: var(--mut); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: .9em; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stack { display: grid; gap: 10px; }
.wrap { max-width: 1280px; margin: 0 auto; }
.hidden-h { display: none !important; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 48px; }
.brand { display: flex; flex-direction: column; line-height: 1.1; padding-block: 6px; }
.brand .sub { font-size: 12px; color: var(--mut); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { color: var(--mut); text-decoration: none; padding: 12px 10px 10px; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 600; font-size: 14px; }
nav.tabs a .n { font-family: var(--mono); font-size: 11px; color: var(--mut); margin-left: 4px; font-weight: 400; }
nav.tabs a.on { color: var(--fg); border-bottom-color: var(--accent); }
@media (max-width: 720px) { .top .wrap { flex-wrap: wrap; gap: 0 12px; } .brand { padding-block: 8px 0; } nav.tabs { flex-basis: 100%; } nav.tabs a { padding: 8px 8px; } }

main, .modal, .lightbox { overflow-wrap: anywhere; }
main { padding-top: 14px; }
section.view { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
section.view > *, .stack > *, .row > * { min-width: 0; }
.row > .chips.scroll { flex: 1 1 240px; }
.lead { color: var(--mut); max-width: 70ch; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; }
.tile .v { font: 600 22px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.tile .k { font-size: 12px; color: var(--mut); margin-top: 2px; }

/* pills and chips */
.pill { display: inline-block; font: 600 11px/1 var(--mono); letter-spacing: .02em; padding: 3px 6px; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; }
.pill.call-ship { color: var(--ship); } .pill.call-ship-as-mode { color: var(--mode); } .pill.call-showcase { color: var(--show); } .pill.call-graph-recipe { color: var(--recipe); } .pill.call-drop { color: var(--drop); }
.pill.st-real { background: var(--ship); color: #fff; border-color: var(--ship); } .pill.st-planned { color: var(--accent); } .pill.st-reserve { color: var(--mut); } .pill.st-recipe { color: var(--recipe); } .pill.st-dropped { color: var(--drop); text-decoration: line-through; } .pill.st-prototype { color: var(--mut); border-style: dashed; } .pill.st-proto-only { color: var(--warn); border-color: var(--warn); border-style: dashed; } .pill.st-covered { background: var(--panel2); color: var(--ship); border-color: var(--ship); } .pill.pcall { color: var(--mut); border-style: dashed; font-weight: 400; }
.pill.kind { background: var(--panel2); border-color: var(--line2); color: var(--fg); white-space: normal; }
.pill.kind.real { background: var(--ship); color: #fff; border-color: var(--ship); }
.fam { display: inline-block; font-size: 12px; color: var(--mut); background: var(--panel2); padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
.chip { background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 3px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
.chips.scroll > * { flex: none; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; min-width: 0; text-align: left; padding: 0; }
.card:hover { border-color: var(--accent); }
.card .th { aspect-ratio: 2 / 1; background: var(--canvas); width: 100%; max-width: 100%; object-fit: cover; display: block; }
.dgrid .card .th { aspect-ratio: 3 / 2; object-fit: contain; }
.card .body { padding: 8px 10px 10px; display: grid; gap: 5px; }
.card .name { font-weight: 700; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.card .one { font-size: 13px; color: var(--mut); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12px; }
.card .cost { margin-left: auto; color: var(--mut); white-space: nowrap; }
img.lazy { background: var(--panel2); }

/* preview */
.preview { display: grid; grid-template-columns: minmax(0, min(720px, 58%)) minmax(260px, 1fr); gap: 14px; align-items: start; }
.preview.compact, .preview.below { grid-template-columns: minmax(0, 1fr); }
.preview.below .pv-side { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); align-items: start; }
@media (max-width: 860px) { .preview { grid-template-columns: minmax(0, 1fr); } }
.pv-stage { display: grid; gap: 6px; min-width: 0; align-content: start; justify-items: start; }
.pv-frame { position: relative; max-width: 100%; }
.pv-canvas { background: var(--canvas); border-radius: 4px; overflow: hidden; touch-action: pan-x pan-y; max-width: 100%; }
.pv-canvas.pan1 { touch-action: none; }
.pv-canvas.scrolls { overflow: auto; overscroll-behavior: contain; }
@media (pointer: coarse) { .pv-canvas.scrolls { overscroll-behavior: auto; } }
.pv-canvas canvas { display: block; max-width: none; cursor: grab; }
.pv-canvas canvas:active { cursor: grabbing; }
.pv-frame .tag { position: absolute; left: 8px; top: 8px; pointer-events: none; }
.pv-frame .msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--on-canvas); font-size: 13px; text-align: center; padding: 16px; pointer-events: none; }
.pv-progress { position: absolute; left: 8px; right: 8px; bottom: 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; background: var(--canvas-veil); color: var(--on-canvas); border-radius: 4px; padding: 6px 8px; font-size: 12px; }
.pv-pbar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .18); overflow: hidden; }
.pv-pbar i { display: block; height: 100%; width: 0; background: var(--on-canvas); }
.pv-ptext { font-family: var(--mono); font-variant-numeric: tabular-nums; min-width: 0; }
.pv-progress button { background: rgba(255, 255, 255, .14); color: var(--on-canvas); border-color: rgba(255, 255, 255, .35); }
.pv-confirm { position: absolute; left: 8px; right: 8px; top: 40px; display: grid; gap: 8px; background: var(--panel); color: var(--fg); border: 1px solid var(--line2); border-radius: 6px; padding: 10px 12px; font-size: 13px; box-shadow: var(--shadow); }
.pv-fsbar { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; }
.pv-fsbar button { background: var(--canvas-veil); color: var(--on-canvas); border-color: rgba(255, 255, 255, .35); }
.pv-side { display: grid; gap: 10px; min-width: 0; align-content: start; }
.pv-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pv-group { border-top: 1px solid var(--line); padding: 6px 0 2px; min-width: 0; }
.pv-group > summary { font-size: 13px; color: var(--mut); margin-bottom: 6px; }
.pv-statline { min-height: 18px; }
.opt { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 6px; align-items: center; font-size: 13px; }
.opt-k { color: var(--mut); font-size: 12px; }
.opt-v { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.opt-v .hint { flex-basis: 100%; }
.opt-v select { max-width: 100%; }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 3px 9px; font-size: 13px; background: var(--panel); }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.ctl { display: grid; grid-template-columns: minmax(70px, 110px) minmax(0, 1fr) 58px; gap: 6px; align-items: center; font-size: 13px; }
.ctl .k { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctl .v { font-family: var(--mono); font-size: 12px; text-align: right; }
.ctl.set .k { color: var(--accent); font-weight: 600; }
.ctls { display: grid; gap: 3px; max-height: 360px; overflow-y: auto; padding-right: 4px; }
.stats { font: 12px/1.4 var(--mono); color: var(--mut); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; flex: 1 1 200px; }
.settings { display: flex; gap: 6px; align-items: flex-start; }
.settings code { flex: 1; min-width: 0; font-size: 12px; max-height: 80px; overflow: auto; display: block; padding: 6px; }
.err { color: var(--bad); font: 12px var(--mono); }
.err:empty { display: none; }
html.pv-noscroll, html.pv-noscroll body { overflow: hidden; }
/* fullscreen: the real API, or fixed over the page when it is refused */
.preview.fs { position: fixed; inset: 0; z-index: 60; margin: 0; background: var(--bg); gap: 0; grid-template-columns: minmax(0, 1fr) min(360px, 40%); grid-template-rows: minmax(0, 1fr); padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.preview.fs .pv-stage { height: 100%; background: var(--canvas); justify-items: center; align-content: center; }
.preview.fs .pv-stage .stats { color: var(--on-canvas); }
.preview.fs .pv-side { height: 100%; overflow-y: auto; padding: 12px; border-left: 1px solid var(--line); background: var(--bg); grid-template-columns: minmax(0, 1fr); }
.preview.fs.noside { grid-template-columns: minmax(0, 1fr); }
.preview.fs.noside .pv-side { display: none; }
@media (max-width: 760px) { .preview.fs { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 45%; } .preview.fs.noside { grid-template-rows: minmax(0, 1fr); } .preview.fs .pv-side { border-left: 0; border-top: 1px solid var(--line); } }

/* the node graph beside a real node's preview */
.preview.hasgraph { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.preview.hasgraph > .pv-side { grid-column: 1 / -1; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); align-items: start; }
.preview.hasgraph.below { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 1000px) { .preview.hasgraph { grid-template-columns: minmax(0, 1fr); } }
.pv-graph { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; }
.pv-graphbox { position: relative; min-height: 200px; background: var(--canvas); border-radius: 4px; overflow: hidden; }
canvas.fne { display: block; width: 100%; height: 100%; }
.fne-park { position: fixed; left: -4000px; top: 0; width: 960px; height: 640px; overflow: hidden; visibility: hidden; pointer-events: none; }
.fne-msg { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; justify-items: center; text-align: center; padding: 16px; color: var(--on-canvas); font-size: 13px; pointer-events: none; }
.fne-msg button { pointer-events: auto; background: rgba(255, 255, 255, .14); color: var(--on-canvas); border-color: rgba(255, 255, 255, .35); }
.grip { height: 12px; cursor: ns-resize; touch-action: none; display: grid; place-items: center; border-radius: 3px; }
.grip::before { content: ""; width: 44px; height: 3px; border-radius: 2px; background: var(--line2); }
.grip:hover::before, .grip:focus-visible::before { background: var(--accent); }
.grip:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pv-hint { margin-bottom: 6px; }
.preview.fs.hasgraph { grid-template-columns: minmax(0, 1fr) min(640px, 46%); grid-template-rows: minmax(0, 3fr) minmax(0, 2fr); }
.preview.fs.hasgraph > .pv-stage { grid-column: 1; grid-row: 1 / 3; }
.preview.fs.hasgraph > .pv-graph { grid-column: 2; grid-row: 1; min-height: 0; height: 100%; align-self: stretch; grid-template-rows: minmax(0, 1fr); }
.preview.fs.hasgraph > .pv-graph .pv-graphbox { height: 100% !important; min-height: 0; border-radius: 0; }
.preview.fs.hasgraph > .pv-graph .grip { display: none; }
.preview.fs.hasgraph > .pv-side { grid-column: 2; grid-row: 2; grid-template-columns: minmax(0, 1fr); border-top: 1px solid var(--line); }
.preview.fs.hasgraph.noside { grid-template-rows: minmax(0, 1fr); }
.preview.fs.hasgraph.noside > .pv-stage { grid-row: 1; }
@media (max-width: 760px) {
  .preview.fs.hasgraph { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 45%; }
  .preview.fs.hasgraph.noside { grid-template-rows: minmax(0, 1fr); }
  .preview.fs.hasgraph > .pv-graph { display: none; }
  .preview.fs.hasgraph > .pv-stage, .preview.fs.hasgraph > .pv-side { grid-column: 1; grid-row: auto; }
}

/* the Editor tab */
body.wide .wrap { max-width: none; }
.ed-shell { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.ed-shell.beside { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); }
.ed-browser { display: grid; gap: 8px; min-width: 0; }
.ed-main { display: grid; gap: 4px; min-width: 0; }
.ed-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 30px; }
.ed-status { flex: 1 1 260px; min-width: 0; font-size: 13px; }
.ed-iso { color: var(--mut); }
.ed-frame { position: relative; background: var(--canvas); border-radius: 4px; overflow: hidden; min-height: 200px; }
.ed-frame.fs { position: fixed; inset: 0; z-index: 60; height: auto !important; border-radius: 0; }
.ed-exit { position: absolute; right: calc(8px + env(safe-area-inset-right, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); background: var(--canvas-veil); color: var(--on-canvas); border-color: rgba(255, 255, 255, .35); }
.ed-foot { display: grid; gap: 6px; font-size: 13px; }
.pr-filters { display: grid; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; min-width: 0; }
.pr-filters input[type=search] { width: 100%; }
.pr-filters select { flex: 1 1 120px; min-width: 0; }
.pr-list { position: relative; overflow-y: auto; max-height: 42vh; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.ed-shell.beside .ed-browser { height: calc(var(--edh, 640px) + 46px); grid-template-rows: auto minmax(0, 1fr); }
.ed-shell.beside .pr-list { max-height: none; height: 100%; }
@media (max-width: 1000px) {
  .ed-shell.beside { grid-template-columns: minmax(0, 1fr); }
  .ed-shell.beside .ed-browser { height: auto; grid-template-rows: none; }
  .ed-shell.beside .pr-list { max-height: 42vh; height: auto; }
}
.pr-item + .pr-item { border-top: 1px solid var(--line); }
.pr-row { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px; width: 100%; padding: 6px 8px; text-align: left; background: none; border: 0; border-radius: 0; align-items: start; }
.pr-row:hover, .pr-item.on .pr-row { background: var(--panel2); }
.pr-th { width: 88px; height: 44px; object-fit: cover; border-radius: 2px; background: var(--canvas); display: block; }
.pr-tx { display: grid; gap: 2px; min-width: 0; }
.pr-name { font-weight: 600; font-size: 14px; }
.pr-pur { font-size: 12px; color: var(--mut); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pr-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; align-items: center; }
.pr-detail { display: grid; gap: 8px; padding: 8px 10px 12px; font-size: 13px; }
.pr-detail > .still { max-width: 460px; }
.pr-big { width: 100%; height: auto; display: block; border-radius: 3px; background: var(--canvas); }
.pill.pst-ok { color: var(--ship); } .pill.pst-notes { color: var(--warn); } .pill.pst-failed { color: var(--bad); } .pill.pst-needs { color: var(--mut); border-style: dashed; }
.pill.src { color: var(--mut); border-color: var(--line2); font-weight: 400; }
.treeacts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
button.toed { border-color: var(--accent); color: var(--accent); background: transparent; font-size: 13px; padding: 2px 8px; }
button.toed:hover { background: var(--accent); color: var(--accent-ink); }
.nooffer { font-size: 12px; color: var(--mut); }
.still .toed { margin-top: 3px; }

/* high resolution stills */
.stills { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; align-items: start; }
.still { margin: 0; cursor: zoom-in; min-width: 0; }
.still-box { overflow: hidden; border-radius: 3px; background: var(--panel2); }
